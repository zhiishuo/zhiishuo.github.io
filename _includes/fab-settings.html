<!-- FAB settings HTML
Place this include near the end of your page (e.g. before </body>). For Jekyll: {% include fab-settings.html %}
If you use a different templating system, insert the inner HTML where you render global components.
-->
<div class="settings-container">
  <button id="settingsBtn" class="settings-btn" aria-label="打开设置" aria-haspopup="true" aria-expanded="false">
    ⚙️
  </button>

  <div id="settingsSheet" class="settings-sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sheet-backdrop" id="sheetBackdrop" tabindex="-1"></div>

    <div class="sheet-panel" role="document" tabindex="-1">
      <button class="close-sheet" id="closeSheet" aria-label="关闭设置">✕</button>
      <h2>设置</h2>
      <ul>
        <li><label><input type="checkbox" id="darkModeToggle"> 深色模式</label></li>
        <li><label><input type="checkbox" id="notifToggle"> 通知</label></li>
        <li><a href="/profile">个人资料</a></li>
      </ul>
    </div>
  </div>
</div>
